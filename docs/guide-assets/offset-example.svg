<text x="820.0" y="530.5507402293458" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#007e87" text-anchor="start">0 В → 1,650 В</text>
<text x="40" y="874.8" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#54656e" text-anchor="start">Пример: −10 В → 0,403 В; 0 В → 1,650 В; +10 В → 2,898 В.</text>
<text x="40" y="918.8" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#54656e" text-anchor="start">При постоянном уровне идеальные буферы и ФНЧ дают U_ADC = U_SUM.</text>
<text x="40" y="962.8" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#54656e" text-anchor="start">Выход за 0…V_A не даёт достоверного результата: возникает насыщение.</text>
<text x="40" y="1059.8" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#a4412d" text-anchor="start">±10 В здесь — расчётные точки, а не разрешение подключать такое напряжение.</text>
