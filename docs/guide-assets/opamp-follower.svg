<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
<rect width="100%" height="100%" fill="white"/>
<polygon points="580,230 580,530 890,380" fill="#eef7f7" stroke="#173340" stroke-width="5"/>
<text x="602" y="340.0" font-family="Segoe UI, sans-serif" font-size="50" font-weight="700" fill="#173340" text-anchor="start">+</text>
<text x="602" y="460.0" font-family="Segoe UI, sans-serif" font-size="50" font-weight="700" fill="#173340" text-anchor="start">−</text>
<text x="700" y="394.4" font-family="Segoe UI, sans-serif" font-size="48" font-weight="700" fill="#007e87" text-anchor="start">ОУ</text>
<polyline points="130,330 580,330" fill="none" stroke="#007e87" stroke-width="5" />
<polygon points="580,330 562.0,339.0 562.0,321.0" fill="#007e87"/>
<text x="130" y="278.0" font-family="Segoe UI, sans-serif" font-size="35" font-weight="700" fill="#007e87" text-anchor="start">Сигнал → вход «+»</text>
<polyline points="890,380 1420,380" fill="none" stroke="#007e87" stroke-width="5" />
<polygon points="1420,380 1402.0,389.0 1402.0,371.0" fill="#007e87"/>
<text x="1110" y="328.0" font-family="Segoe UI, sans-serif" font-size="35" font-weight="700" fill="#007e87" text-anchor="start">Выход → дальше</text>
<circle cx="1050" cy="380" r="7" fill="#007e87" stroke="#007e87" stroke-width="3"/>
<polyline points="1050,380 1050,600 480,600 480,440 580,440" fill="none" stroke="#007e87" stroke-width="5" />
<polygon points="580,440 562.0,449.0 562.0,431.0" fill="#007e87"/>
<text x="720" y="661.4" font-family="Segoe UI, sans-serif" font-size="33" font-weight="400" fill="#173340" text-anchor="middle">Обратная связь: выход соединён со входом «−»</text>
<polyline points="735,170 735,305" fill="none" stroke="#54656e" stroke-width="4" />
<polyline points="735,455 735,535" fill="none" stroke="#54656e" stroke-width="4" />
<text x="735" y="129.6" font-family="Segoe UI, sans-serif" font-size="37" font-weight="700" fill="#54656e" text-anchor="middle">V_A</text>
<text x="760" y="209.0" font-family="Segoe UI, sans-serif" font-size="30" font-weight="400" fill="#54656e" text-anchor="start">питание</text>
<text x="735" y="574.8" font-family="Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#54656e" text-anchor="middle">AGND</text>
<text x="60" y="755.6" font-family="Segoe UI, sans-serif" font-size="32" font-weight="400" fill="#54656e" text-anchor="start">Идеально: U_выход ≈ U_вход. Повторитель отделяет делитель от следующей нагрузки.</text>
<text x="60" y="800.6" font-family="Segoe UI, sans-serif" font-size="32" font-weight="400" fill="#54656e" text-anchor="start">Вход «−» и нижняя шина питания AGND — разные выводы.</text>
</svg>
