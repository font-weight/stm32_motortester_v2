<text x="68" y="64.8" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#54656e" text-anchor="start">J3: V_A / AGND → питание U1 (pins 4 / 11) и местного TEST.</text>
<text x="68" y="108.8" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#54656e" text-anchor="start">V_A должна быть общей с VDDA/Vref+ АЦП; источник и монтаж требуют проверки.</text>
