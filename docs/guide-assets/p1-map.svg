<text x="1345.0" y="966.8" font-family="Segoe UI, sans-serif" font-size="31" font-weight="400" fill="#173340" text-anchor="middle">после проверки</text>
<text x="40" y="1074.0" font-family="Segoe UI, sans-serif" font-size="30" font-weight="400" fill="#54656e" text-anchor="start">U1D: повторитель BUF, выход наружу не используется. Общая земля — AGND.</text>
<text x="40" y="1117.0" font-family="Segoe UI, sans-serif" font-size="30" font-weight="400" fill="#54656e" text-anchor="start">Функциональная карта P1-LV. Не монтажная схема и не вход ёмкостного датчика.</text>
